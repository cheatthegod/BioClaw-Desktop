name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Each tag gets a single release run; cancel duplicates if the tag is re-pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # tauri-action creates / updates the GitHub Release for us.
  contents: write

env:
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: 'stable'

jobs:
  # -----------------------------------------------------------------------------
  # Single matrix job per platform. tauri-action takes care of:
  #   1. building the bundles
  #   2. signing them (mac/win/updater) via the env block below
  #   3. creating / appending to a single GitHub Release draft
  # so we do NOT need a separate "publish" job.
  # -----------------------------------------------------------------------------
  release:
    name: Build & sign (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            # deb + appimage. AppImage is REQUIRED for Linux auto-update — the
            # Tauri Linux updater can only self-replace an AppImage, never a
            # deb. The old FUSE-less-runner AppImage hang is worked around by
            # APPIMAGE_EXTRACT_AND_RUN=1 in the step env (extract instead of
            # FUSE-mount). deb stays for apt-style manual installs.
            tauri-args: '--bundles deb appimage'
          # Universal macOS: one .dmg runs natively on BOTH Apple Silicon and
          # Intel. Now trivial since the desktop is a thin web shell (no
          # per-arch externalBin sidecar/uv to lipo).
          - name: macos-universal
            os: macos-14
            rust-target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: '--target universal-apple-darwin'
          - name: windows-x86_64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: '--target x86_64-pc-windows-msvc'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Rust toolchain (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.platform.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'release-${{ matrix.platform.name }}'

      - name: Install system deps for tauri (Linux)
        if: matrix.platform.os == 'ubuntu-22.04'
        # libappindicator3-dev and libayatana-appindicator3-dev are
        # mutually exclusive (apt conflict). Tauri 2 wants ONLY the
        # ayatana variant on Ubuntu 22+; the old indicator name lingered
        # in our deps list from when we copied from a Tauri 1 template.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm dependencies
        run: npm ci

      # NOTE: the desktop app is now a thin shell that loads the web UI
      # (chat.bioclaw.tech) directly, so it no longer bundles the local
      # sidecar / uv / Python env / skills. Those vendor steps (and the
      # externalBin/resources entries in tauri.conf.json) were removed —
      # the installer dropped from ~250 MB to ~15 MB and the build has far
      # fewer moving parts.

      # --------------------------------------------------------------------
      # Forward code-signing secrets to the bundler ONLY if they're actually
      # configured. tauri-action interprets `APPLE_CERTIFICATE=` (empty
      # string) as "import this empty p12" and the macOS .dmg build aborts.
      # See the long comment under the next step for the full backstory.
      # --------------------------------------------------------------------
      - name: Forward signing secrets (if configured)
        shell: bash
        env:
          APPLE_CERTIFICATE:           ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:  ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:      ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:              ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE:         ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD \
                      APPLE_TEAM_ID WINDOWS_CERTIFICATE \
                      WINDOWS_CERTIFICATE_PASSWORD; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              # Use the heredoc form so multi-line secrets (.p12 base64
              # blobs) round-trip cleanly. End-marker prefixed with __
              # so it can't collide with any plausible secret content.
              {
                echo "${name}<<__SECRET_${name}__"
                printf '%s\n' "$value"
                echo "__SECRET_${name}__"
              } >> "$GITHUB_ENV"
              echo "  forwarding $name (length ${#value})"
            else
              echo "  skip $name (unset)"
            fi
          done

      # --------------------------------------------------------------------
      # tauri-action: build + sign + upload to a draft GitHub Release.
      # tauri-action reads the APPLE_*, WINDOWS_CERTIFICATE_* and
      # TAURI_SIGNING_* env vars and wires them into the bundler.
      # --------------------------------------------------------------------
      - name: Tauri build, sign & upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          # cargo HTTP transport is occasionally flaky on GitHub runners
          # (the v0.2.0-preview5 Linux job died at "[16] Error in the
          # HTTP2 framing layer" pulling `getrandom`). Falling back to
          # HTTP/1.1 + raising the retry count fixes it deterministically.
          CARGO_HTTP_MULTIPLEXING: 'false'
          CARGO_NET_RETRY: '10'
          CARGO_HTTP_TIMEOUT: '120'
          # ---- Code-signing secrets ----------------------------------------
          # IMPORTANT: these env vars are intentionally NOT passed here.
          # `${{ secrets.X }}` evaluates to an empty string when the secret
          # isn't configured, and tauri-action interprets "set-but-empty"
          # APPLE_CERTIFICATE as "try to import this empty p12" — which
          # blows up with `SecKeychainItemImport: parameters were not valid`
          # and kills the macOS .dmg build (preview7 hit exactly this).
          #
          # We populate them via the "Forward signing secrets" step ABOVE,
          # which writes only the secrets that are actually populated into
          # GITHUB_ENV. Result: when no Apple cert is configured, the .dmg
          # builds unsigned (Gatekeeper warning on first open — right-click
          # Open works around it). When the user configures APPLE_*
          # secrets later, this same workflow signs + notarizes without
          # any other change.

          # Build the Linux AppImage without FUSE (GitHub runners have no FUSE):
          # appimagetool/linuxdeploy extract-and-run instead of mounting, which
          # is what used to hang the job. No-op on macOS/Windows.
          APPIMAGE_EXTRACT_AND_RUN: 1

          # ---- Updater (minisign) signing -----------------------------------
          # Signs the .sig files the updater plugin downloads alongside each
          # bundle. The pubkey baked into tauri.conf.json must match this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # GITHUB_TOKEN is consumed by tauri-action to create the Release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: ${{ github.ref_name }}
          releaseName: 'BioClaw v__VERSION__'
          releaseBody: |
            See the assets below to download and install BioClaw for your
            platform. Automatic updates are signed with the BioClaw updater
            key — clients with mismatched pubkeys will refuse to update.

            **Checksums** (SHA-256) are attached as `*.sha256` next to each
            installer.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.platform.tauri-args }}

      # Also stash the raw bundles as workflow artifacts so we can debug a
      # bad release without re-running the matrix.
      - name: Upload bundle artifacts (debug copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioclaw-${{ matrix.platform.name }}-${{ github.ref_name }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/${{ matrix.platform.rust-target }}/release/bundle/**/*
            src-tauri/target/universal-apple-darwin/release/bundle/**/*
