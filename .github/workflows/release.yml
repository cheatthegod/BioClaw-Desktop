name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Each tag gets a single release run; cancel duplicates if the tag is re-pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # tauri-action creates / updates the GitHub Release for us.
  contents: write

env:
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: 'stable'

jobs:
  # -----------------------------------------------------------------------------
  # Single matrix job per platform. tauri-action takes care of:
  #   1. building the bundles
  #   2. signing them (mac/win/updater) via the env block below
  #   3. creating / appending to a single GitHub Release draft
  # so we do NOT need a separate "publish" job.
  # -----------------------------------------------------------------------------
  release:
    name: Build & sign (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: ''
          # Preview builds ship arm64-only — runs natively on Apple
          # Silicon, runs under Rosetta on Intel. Universal needs lipo'd
          # sidecar + uv binaries (we ship two separate arch ones), which
          # is more CI plumbing than these previews need.
          - name: macos-aarch64
            os: macos-14
            rust-target: aarch64-apple-darwin
            tauri-args: '--target aarch64-apple-darwin'
          - name: windows-x86_64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: '--target x86_64-pc-windows-msvc'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Rust toolchain (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.platform.rust-target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: 'release-${{ matrix.platform.name }}'

      - name: Install system deps for tauri (Linux)
        if: matrix.platform.os == 'ubuntu-22.04'
        # libappindicator3-dev and libayatana-appindicator3-dev are
        # mutually exclusive (apt conflict). Tauri 2 wants ONLY the
        # ayatana variant on Ubuntu 22+; the old indicator name lingered
        # in our deps list from when we copied from a Tauri 1 template.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm dependencies
        run: npm ci

      # --------------------------------------------------------------------
      # Build the sidecar JS bundle for the current platform.
      # esbuild produces all 4 target bundles in one run; we keep just the
      # one matching this matrix entry so tauri.conf.json's externalBin
      # picks it up. The Tauri build will fail with "sidecar binary not
      # found" if this step is skipped.
      # --------------------------------------------------------------------
      - name: Build sidecar bundle
        working-directory: sidecar
        run: |
          npm ci
          npm run build

      # --------------------------------------------------------------------
      # Build the Rust sidecar and place it at the externalBin path,
      # overwriting the Node bundle so the shipped binary is the
      # self-contained Rust one (no Node runtime dependency).
      # --------------------------------------------------------------------
      - name: Build Rust sidecar (externalBin)
        shell: bash
        run: bash scripts/build-sidecar-rs.sh ${{ matrix.platform.rust-target }}

      # --------------------------------------------------------------------
      # Vendor uv per platform — Astral's prebuilt binary. tauri-bundler
      # picks it up via the externalBin entry in tauri.conf.json.
      # --------------------------------------------------------------------
      - name: Vendor uv binary
        env:
          # Pin uv so vendor-uv.sh skips its "query GitHub API for latest"
          # branch, which hits the 60 req/hour anon rate limit on shared
          # CI IPs (macOS runner ran into this on preview6).
          UV_VERSION: '0.11.25'
          # All three matrix entries are single-triple now (mac dropped
          # universal in favor of aarch64-only for previews — runs on
          # Intel via Rosetta).
          BIOCLAW_UV_TARGETS: ${{ matrix.platform.rust-target }}
        shell: bash
        run: bash scripts/vendor-uv.sh

      # --------------------------------------------------------------------
      # Vendor the bundled Python env zip — runs `uv python install
      # --install-dir _base` + `uv sync --frozen` against the bundled
      # `_uv-cache/`, then zips it as `binaries/bioclaw-env.zip`
      # (alongside a triple-suffixed copy). Tauri ships the zip as a
      # bundle resource; the sidecar extracts + runs `uv sync --offline`
      # on first launch for the OmicOS-style no-network unpack flow.
      # ~5-8 min per platform on a clean cache; takes ~250 MB of installer
      # space but eliminates the SetupWizard from the user experience.
      # --------------------------------------------------------------------
      - name: Vendor skills catalog
        shell: bash
        run: bash scripts/vendor-skills.sh
      - name: Vendor bioclaw-env zip (Python + uv-cache)
        env:
          BIOCLAW_ENV_TARGET: ${{ matrix.platform.rust-target }}
        shell: bash
        run: bash scripts/vendor-env.sh

      # --------------------------------------------------------------------
      # Windows-only: build the tiny native launcher.exe that locates
      # node.exe and execs the sidecar JS bundle. Without this, Windows
      # users would download an installer whose sidecar is just a
      # mislabelled .js file the OS can't execute.
      # --------------------------------------------------------------------
      - name: Build Windows sidecar launcher.exe
        if: matrix.platform.os == 'windows-latest'
        working-directory: sidecar/launcher-win
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          Copy-Item -Force `
            target/x86_64-pc-windows-msvc/release/bioclaw-sidecar-launcher.exe `
            ../../src-tauri/binaries/bioclaw-sidecar-x86_64-pc-windows-msvc.exe

      # --------------------------------------------------------------------
      # Forward code-signing secrets to the bundler ONLY if they're actually
      # configured. tauri-action interprets `APPLE_CERTIFICATE=` (empty
      # string) as "import this empty p12" and the macOS .dmg build aborts.
      # See the long comment under the next step for the full backstory.
      # --------------------------------------------------------------------
      - name: Forward signing secrets (if configured)
        shell: bash
        env:
          APPLE_CERTIFICATE:           ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD:  ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:      ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:              ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE:         ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD \
                      APPLE_TEAM_ID WINDOWS_CERTIFICATE \
                      WINDOWS_CERTIFICATE_PASSWORD; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              # Use the heredoc form so multi-line secrets (.p12 base64
              # blobs) round-trip cleanly. End-marker prefixed with __
              # so it can't collide with any plausible secret content.
              {
                echo "${name}<<__SECRET_${name}__"
                printf '%s\n' "$value"
                echo "__SECRET_${name}__"
              } >> "$GITHUB_ENV"
              echo "  forwarding $name (length ${#value})"
            else
              echo "  skip $name (unset)"
            fi
          done

      # --------------------------------------------------------------------
      # tauri-action: build + sign + upload to a draft GitHub Release.
      # tauri-action reads the APPLE_*, WINDOWS_CERTIFICATE_* and
      # TAURI_SIGNING_* env vars and wires them into the bundler.
      # --------------------------------------------------------------------
      - name: Tauri build, sign & upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          # cargo HTTP transport is occasionally flaky on GitHub runners
          # (the v0.2.0-preview5 Linux job died at "[16] Error in the
          # HTTP2 framing layer" pulling `getrandom`). Falling back to
          # HTTP/1.1 + raising the retry count fixes it deterministically.
          CARGO_HTTP_MULTIPLEXING: 'false'
          CARGO_NET_RETRY: '10'
          CARGO_HTTP_TIMEOUT: '120'
          # ---- Code-signing secrets ----------------------------------------
          # IMPORTANT: these env vars are intentionally NOT passed here.
          # `${{ secrets.X }}` evaluates to an empty string when the secret
          # isn't configured, and tauri-action interprets "set-but-empty"
          # APPLE_CERTIFICATE as "try to import this empty p12" — which
          # blows up with `SecKeychainItemImport: parameters were not valid`
          # and kills the macOS .dmg build (preview7 hit exactly this).
          #
          # We populate them via the "Forward signing secrets" step ABOVE,
          # which writes only the secrets that are actually populated into
          # GITHUB_ENV. Result: when no Apple cert is configured, the .dmg
          # builds unsigned (Gatekeeper warning on first open — right-click
          # Open works around it). When the user configures APPLE_*
          # secrets later, this same workflow signs + notarizes without
          # any other change.

          # ---- Updater (minisign) signing -----------------------------------
          # Signs the .sig files the updater plugin downloads alongside each
          # bundle. The pubkey baked into tauri.conf.json must match this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # GITHUB_TOKEN is consumed by tauri-action to create the Release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: ${{ github.ref_name }}
          releaseName: 'BioClaw v__VERSION__'
          releaseBody: |
            See the assets below to download and install BioClaw for your
            platform. Automatic updates are signed with the BioClaw updater
            key — clients with mismatched pubkeys will refuse to update.

            **Checksums** (SHA-256) are attached as `*.sha256` next to each
            installer.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.platform.tauri-args }}

      # Also stash the raw bundles as workflow artifacts so we can debug a
      # bad release without re-running the matrix.
      - name: Upload bundle artifacts (debug copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioclaw-${{ matrix.platform.name }}-${{ github.ref_name }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/${{ matrix.platform.rust-target }}/release/bundle/**/*
            src-tauri/target/universal-apple-darwin/release/bundle/**/*
