appId: com.bioclaw.desktop
productName: BioClaw
copyright: Copyright 2026

# Don't let electron-builder auto-publish to GitHub on CI.
# (In v26 it implicitly enables publishing when it sees CI=true,
#  fails on missing GH_TOKEN, and aborts the build.)  Our GitHub
# Actions workflow uploads artifacts via softprops/action-gh-release
# in a separate step, so we opt out here.
publish: null

directories:
  buildResources: assets
  output: release

# ── What goes into the app ──
files:
  - electron-dist/**/*
  - electron/setup-wizard.html
  - node_modules/**/*
  - "!node_modules/**/test/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.map"

extraResources:
  # Skills
  - from: container/skills
    to: skills
    filter:
      - "**/*"
      - "!**/tests/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  # Agent runner (compiled JS + deps + package.json for ESM "type": "module")
  - from: container/agent-runner/dist
    to: agent-runner/dist
  - from: container/agent-runner/node_modules
    to: agent-runner/node_modules
  - from: container/agent-runner/package.json
    to: agent-runner/package.json
  # Web UI assets
  - from: src/channels/local-web/assets
    to: web-assets
  - from: bioclaw_logo.jpg
    to: web-assets/bioclaw_logo.jpg

# ── Windows ──
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
  artifactName: BioClaw-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BioClaw

# ── macOS ──
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Linux ──
linux:
  target:
    - target: AppImage
    - target: deb
  icon: assets/icon.png
  category: Science
  desktop:
    entry: |
      [Desktop Entry]
      Name=BioClaw
      Comment=AI-Powered Bioinformatics Assistant
      Categories=Science;Biology;

appImage:
  artifactName: BioClaw-${version}.${ext}
