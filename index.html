<!DOCTYPE html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/bioclaw.svg" />
    <!--
      Editorial typography — Inter (UI body), Instrument Serif (display
      headlines), JetBrains Mono (code / data). Same URL the SaaS frontend
      uses so a WebView already warmed from chat.bioclaw.tech hits a cache.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--
      CSP — extend the Phase-2 baseline so Google Fonts loads:
        * style-src   adds fonts.googleapis.com (the @font-face CSS)
        * font-src    adds fonts.gstatic.com    (the actual .woff2)
      connect-src already covers the BioClaw SaaS; img-src stays open.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' tauri: ipc:; connect-src 'self' tauri: ipc: https://chat.bioclaw.tech wss://chat.bioclaw.tech; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-eval'"
    />
    <title>BioClaw</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
