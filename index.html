<!doctype html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/bioclaw.svg" />
    <!--
      Editorial typography — Inter (UI body), Instrument Serif (display
      headlines), JetBrains Mono (code / data). Same URL the SaaS frontend
      uses so a WebView already warmed from chat.bioclaw.tech hits a cache.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--
      NOTE: CSP is defined ONCE, in src-tauri/tauri.conf.json (app.security.csp).
      A second <meta> CSP here used to conflict (browsers enforce the
      intersection), which silently blocked fonts and the local sidecar.
    -->
    <title>BioClaw</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
