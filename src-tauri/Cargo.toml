[package]
name = "bioclaw-desktop"
version = "0.2.0"
description = "BioClaw Desktop — AI-powered biomedical research agent"
authors = ["BioClaw <hello@bioclaw.tech>"]
edition = "2021"
license = "MIT"
homepage = "https://chat.bioclaw.tech"
repository = "https://github.com/bioclaw/bioclaw-desktop"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# NOTE: "devtools" is temporarily enabled in this preview so the shipped
# (release) build can open the WebView2 console — needed to diagnose the
# webview→sidecar "Failed to fetch". Drop it once connectivity is confirmed.
tauri = { version = "2.4", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-deep-link = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-http = "2.4"
tauri-plugin-log = "2.4"
tauri-plugin-notification = "2.2"
tauri-plugin-os = "2.2"
tauri-plugin-process = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-store = "2.2"
tauri-plugin-updater = "2.4"
tauri-plugin-window-state = "2.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["full"] }

# Cross-platform secure credential storage. keyring v3 has NO default backend
# — without an explicit platform feature it silently falls back to an in-memory
# **mock** store (every Entry::new() is a fresh empty MockCredential), so saved
# tokens/API keys can never be read back. That broke device-code login
# persistence AND local LLM API-key storage on the shipped app. Enable the real
# per-OS backends (each dep is target-gated, so all three build cross-platform):
#   Keychain (macOS), Credential Manager (Windows), Secret Service (Linux,
#   dbus-secret-service v4 = pure-Rust zbus, no system libdbus needed).
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
dirs = "5"

[lib]
name = "bioclaw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Reduce binary size in release builds. tradeoff: ~30s slower release link;
# saves ~5-10 MB on the final installer.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
