[package]
name = "bioclaw-desktop"
version = "0.2.0"
description = "BioClaw Desktop — AI-powered biomedical research agent"
authors = ["BioClaw <hello@bioclaw.tech>"]
edition = "2021"
license = "MIT"
homepage = "https://chat.bioclaw.tech"
repository = "https://github.com/bioclaw/bioclaw-desktop"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.4", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-http = "2.4"
tauri-plugin-log = "2.4"
tauri-plugin-notification = "2.2"
tauri-plugin-os = "2.2"
tauri-plugin-process = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-store = "2.2"
tauri-plugin-updater = "2.4"
tauri-plugin-window-state = "2.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["full"] }

# Cross-platform secure credential storage. Default features auto-select the
# right backend: Keychain (macOS), Credential Manager (Windows), Secret
# Service / gnome-keyring / kwallet (Linux). See src/credentials.rs.
keyring = { version = "3", default-features = true }
dirs = "5"

[lib]
name = "bioclaw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Reduce binary size in release builds. tradeoff: ~30s slower release link;
# saves ~5-10 MB on the final installer.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
